; CrowdTune 1.0 - a behaved, seated regular-season crowd for NBA 2K14 (PC)
; Keep this file next to CrowdTune.asi (SLAM\CrowdTune\).
; Works with the stock crowd.iff. Edit, then restart the game.
[Settings]
Enabled=1
Log=1

[Crowd]
; ---- how full the arena is ----
; share of the game's own crowd that shows up (1 = stock: a Lakers home game is sold out).
; The game hides seats at random, so the empty seats are spread around the bowl.
Attendance=0.85
PlayoffAttendance=1.0
; 0 = detect playoff games, 1 = treat every game as playoffs, 2 = never playoffs
Playoffs=0

; ---- arena loads / tip-off ----
; everybody starts seated when the arena loads (stock: everybody starts standing, then sits down)
StartSeated=1
; Calm phases: pregame / intros / tip-off ceremony / timeouts / breaks, the first
; TipOffCalmSeconds of live play and ResumeCalmSeconds after every break
CalmOutsidePlay=1
TipOffCalmSeconds=45
ResumeCalmSeconds=10

; ---- normal play: everybody sits quietly ----
; share standing (0 = nobody), share clapping (seated) when the game would have them clap
StandingIdle=0
ApplauseNormalPlay=0
; a fan sitting quietly keeps sitting for at least this many seconds before another mood
; (stops the sit <-> head-in-hands flicker during normal play)
CalmHoldSeconds=12
; opponent's play: share showing disappointment (seated, head in hands); the rest sits quietly
Disappointed=0.03

; ---- a scoring reaction (the game asks the crowd to cheer, or a ScoreSituations code) ----
; seated applause share, and share raising their hands from their seat
ApplauseScore=0.45
HandsUpScore=0.08
ScoreSituations=3

; ---- the game's "big play" codes (used for dunks; on their own only without the scoreboard) ----
; standing share (StandOnBigMoments=0: nobody ever stands up), share cheering seated,
; everybody else applauds. High claps / hands up / standing up while clapping only here.
StandOnBigMoments=1
StandBig=0.50
HandsUpBig=0.20
BigSituations=7,8,11
; keep the men's energetic applause clips for big moments only (done in memory, stock crowd.iff)
BigMomentApplauseOnly=1

; ---- scoreboard reactions ----
; CrowdTune follows the score, the game clock, the shot clock and the quarter:
;   home basket             calm seated claps (a three: a few more, some hands up)
;   home dunk / and-one     amazed: people jump up, hands up, claps
;   away dunk / and-one     disbelief: hands on / behind heads (half the arena), the rest sits quietly
;   away basket             quiet; in the 4th, when the opponent cuts into a home lead (a run of 4+ points,
;                           the lead down to 8 or less), ties it or takes the lead: upset - head shaking,
;                           arms crossed, hands on heads; the bigger the run, the more of them
;   home basket in the 4th  louder; in a close game some stand up
;   a horn on its own       nothing (end of a quarter, shot-clock violation)
;   a shot that goes in AFTER the horn (end of a quarter, or the shot clock ran out): WOW - more for a three;
;                           the opponent's: disbelief
;   4th / OT buzzer beater  to WIN or TIE: the biggest reaction of the game
;   final horn              the reaction starts AT the horn (no sitting down first) and lasts 40 s:
;                           home win: celebration (after a close finish: almost everybody up;
;                           double digits: more claps than standing); home loss: everybody upset
ScoreboardReactions=1
; close finish: in the last CloseGameSeconds of the 4th / overtime (12-minute quarters; scaled to
; your quarter length, at least 25 s) with the score within CloseGameMargin, fans stand up -
; more and more as the clock runs down (half of CloseGameStand at the start of the window, all of it
; at the horn); tied at the horn: they stay up through the break before overtime
CloseGameMargin=5
CloseGameSeconds=120
CloseGameStand=0.80
; halftime: fans head out during the break; when the 3rd quarter starts only ThirdQuarterStart of them are back in
; their seats, and the arena fills back up until ThirdQuarterFullAfter of the quarter has been played
ThirdQuarterStart=0.55
ThirdQuarterFullAfter=0.50
; 4th quarter / overtime: the crowd stays as it is, unless the OPPONENT leads by LeaveWhenTrailingBy
; or more - then fans slowly leave (LeavePerPoint per point beyond that, at most LeaveMax). Those who
; left don't come back, but if the home team comes back, the ones still there get the close-finish
; treatment (standing as the clock runs down).
LeaveWhenTrailingBy=15
LeavePerPoint=0.02
LeaveMax=0.30
; home team: 0 = detect (the log shows "home=A" or "home=B"), 1 = team A, 2 = team B
HomeTeam=0

; ---- props: towels, thunder sticks, foam fingers, signs, chants ----
; playoff games only: share of a big moment allowed to wave props / chant. Never in the regular season.
PropsBig=0.06

; The game's excitement level stays at 1.00 for whole games, so it is ignored.
; UseExcitement=1 treats excitement >= ExcitementBig as a high-emotion moment again.
UseExcitement=0
ExcitementBig=0.85

; Seconds between lines in CrowdTune.log (0 = no statistics). Each line shows the situation code,
; the level, the quarter, the score (home-away), the EVENT the crowd is reacting to, the clocks
; and the share of the crowd shown.
LogEverySeconds=2
